spring.application.name=attendance-management
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:h2:file:./data/attendance;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jackson.time-zone=Asia/Shanghai
server.servlet.session.timeout=60m
server.error.include-message=never
attendance.admin.username=${ADMIN_USERNAME:admin}
attendance.admin.password=${ADMIN_PASSWORD:Admin@2026}
attendance.seed-demo=${SEED_DEMO:true}
